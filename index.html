<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القفل ستوري - Al-Qufl Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر مع الشعار الذهبي المفرغ المتوهج -->
    <header>
        <div class="brand-logo">
            <div class="glowing-circle-badge">
                <img src="https://i.postimg.cc/Tw43Dc4n/1000004822-removebg-preview.png" alt="QST Logo" class="brand-logo-img">
            </div>
            <h1>القفل ستوري</h1>
        </div>
        <div class="cart-icon-btn" onclick="openCartModal()">
            <i class="fa-solid fa-cart-shopping"></i>
            <div class="cart-badge" id="cartBadge">0</div>
        </div>
    </header>

    <!-- بنر الواجهة الرئيسي -->
    <div class="store-banner-wrapper">
        <div class="store-banner-container">
            <img src="https://i.ibb.co/Kp9SzZYB/1777197412902.png" alt="متجر القفل" class="store-banner-img">
        </div>
    </div>

    <div class="container">
        <!-- شريط التصنيفات -->
        <div class="category-scroll">
            <button class="cat-btn active" onclick="filterCategory('ملابس نسائية', this)">ملابس نسائية</button>
            <button class="cat-btn" onclick="filterCategory('ملابس اطفال', this)">ملابس اطفال</button>
            <button class="cat-btn" onclick="filterCategory('العناية بالجسم', this)">العناية بالجسم</button>
            <button class="cat-btn" onclick="filterCategory('مستلزمات البيت', this)">مستلزمات البيت</button>
            <button class="cat-btn" onclick="filterCategory('عطور فاخره', this)">عطور فاخره</button>
            <button class="cat-btn" onclick="filterCategory('اكسسورات', this)">اكسسورات</button>
        </div>

        <!-- شبكة المنتجات -->
        <div class="products-grid" id="productsGrid">
            <!-- يتم تحميل المنتجات ديناميكياً -->
        </div>
    </div>

    <!-- شريط السلة السفلي العائم -->
    <div class="floating-cart-bar" id="floatingCart">
        <div class="cart-info">
            <div class="cart-info-total" id="floatingTotal">0 ريال قعيطي</div>
            <div class="cart-info-count" id="floatingCount">0 منتجات في السلة</div>
        </div>
        <button class="checkout-btn" onclick="openCartModal()">
            <i class="fa-brands fa-whatsapp"></i>
            إكمال الطلب
        </button>
    </div>

    <!-- نافذة السلة والدفع Modal -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>سلة التسوق والدفع</h3>
                <button class="close-modal-btn" onclick="closeCartModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="cartItemsList"></div>

                <div class="payment-section">
                    <label for="paymentMethod"><i class="fa-solid fa-wallet"></i> اختر طريقة الدفع المعتمدة:</label>
                    <select id="paymentMethod" class="payment-select">
                        <option value="بنك الكريمي (الكريمي جوال)">بنك الكريمي (الكريمي جوال)</option>
                        <option value="محفظة أم فلوس (Am Flous)">أم فلوس (Am Flous)</option>
                        <option value="بنك بن دول (Bin Dowal Bank)">بنك بن دول (Bin Dowal)</option>
                        <option value="شركة العمقي للصرافة (Al-Amqi)">العمقي للصرافة (حوالة)</option>
                        <option value="الدفع عند الاستلام">الدفع عند الاستلام</option>
                    </select>

                    <textarea id="customerNotes" class="customer-notes" placeholder="ملاحظات الطلب أو العنوان بالتفصيل..." rows="3"></textarea>

                    <button class="send-whatsapp-btn" onclick="sendToWhatsApp()">
                        <i class="fa-brands fa-whatsapp"></i>
                        تأكيد وإرسال الطلب عبر الواتساب
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- الفوتر الاحترافي -->
    <footer class="main-footer">
        <div class="footer-grid">
            <div class="footer-col brand-info-col">
                <div class="footer-logo-wrap">
                    <img src="https://i.postimg.cc/Tw43Dc4n/1000004822-removebg-preview.png" alt="شعار القفل ستوري" class="footer-logo-img">
                </div>
                <h3>القفل ستوري</h3>
                <p>وجهتك الأولى للتسوق الذكي. نلبي احتياجات الأسرة بأعلى معايير الجودة وسرعة التوصيل.</p>
                <a href="https://wa.me/967739572620" target="_blank" class="gold-whatsapp-btn">
                    <i class="fa-brands fa-whatsapp"></i> خدمة العملاء
                </a>
            </div>

            <div class="footer-col">
                <h3>طرق الدفع المحلية المعتمدة</h3>
                <div class="payment-badges-grid">
                    <div class="pay-badge"><i class="fa-solid fa-building-columns"></i> بنك الكريمي</div>
                    <div class="pay-badge"><i class="fa-solid fa-mobile-screen"></i> أم فلوس</div>
                    <div class="pay-badge"><i class="fa-solid fa-money-bill-transfer"></i> بنك بن دول</div>
                    <div class="pay-badge"><i class="fa-solid fa-wallet"></i> العمقي للصرافة</div>
                </div>
            </div>
        </div>

        <div class="bottom-copyright">
            جميع الحقوق محفوظة © 2026 <span class="designer-tag">القفل ستوري</span>
        </div>
    </footer>

    <!-- ربط ملف المنتجات أولاً ثم ملف التشغيل -->
    <script src="products.js"></script>
    <script src="script.js"></script>
</body>
</html>
